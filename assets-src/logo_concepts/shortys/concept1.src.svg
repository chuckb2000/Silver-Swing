<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Shorty's - Concept 1: The Bedded Fawn</title>
  <defs>
    <clipPath id="body"><ellipse cx="18.6" cy="21" rx="9.6" ry="6"/></clipPath>
  </defs>
  <!-- a nest of dune grass -->
  <path d="M3.6 28.4 C8 26.4 24 26.4 29 28.4 L29 29.8 L3.6 29.8 Z" fill="#b8a24a"/>
  <path d="M4.6 29 L5.8 25 L6.8 28 L8 24.4 L8.8 28 Z" fill="#d6c060"/>
  <path d="M24.6 28 L25.8 24.2 L26.6 27.6 L28 25 L27.8 28.6 Z" fill="#d6c060"/>
  <!-- the body, lying down, legs tucked -->
  <ellipse cx="18.6" cy="21" rx="9.6" ry="6" fill="#b5733d"/>
  <g clip-path="url(#body)">
    <rect x="0" y="23.4" width="32" height="5" fill="#e3c49a"/>
    <rect x="23.6" y="14" width="6" height="10" fill="#93592c"/>
    <path d="M9 16.6 C14 14.6 22 14.6 28 17 L28 18.2 C22 16 14 16 9 18 Z" fill="#7a4622"/>
  </g>
  <!-- white spots in rows along the back -->
  <g fill="#f6f6f2">
    <rect x="12.6" y="18.4" width="1.2" height="1.2"/><rect x="15.6" y="17.6" width="1.2" height="1.2"/>
    <rect x="18.6" y="17.4" width="1.2" height="1.2"/><rect x="21.6" y="17.8" width="1.2" height="1.2"/>
    <rect x="24.4" y="18.6" width="1.2" height="1.2"/>
    <rect x="14" y="20.6" width="1.2" height="1.2"/><rect x="17.2" y="20.2" width="1.2" height="1.2"/>
    <rect x="20.4" y="20.2" width="1.2" height="1.2"/><rect x="23.4" y="21" width="1.2" height="1.2"/>
  </g>
  <!-- folded foreleg -->
  <path d="M9.6 24.6 L14.6 24.6 L14.6 26.4 L9.6 26.4 Z" fill="#93592c"/>
  <rect x="8.6" y="24.8" width="1.6" height="1.6" fill="#2a2422"/>
  <!-- neck and head, raised and alert -->
  <path d="M7.6 13 L12.6 11.4 L15.6 18.4 L10 20.4 Z" fill="#b5733d"/>
  <path d="M8.4 14.6 L10.6 14 L12.4 19.4 L10.2 20.2 Z" fill="#e3c49a"/>
  <ellipse cx="9.6" cy="10.6" rx="3.8" ry="3.2" fill="#b5733d"/>
  <ellipse cx="6.2" cy="12.8" rx="2.6" ry="1.8" fill="#b5733d"/>
  <ellipse cx="6.4" cy="13.6" rx="2.2" ry="1" fill="#e3c49a"/>
  <rect x="3.4" y="12.2" width="1.6" height="1.4" fill="#12181e"/>
  <!-- big ears -->
  <path d="M8.6 8.4 L4.4 3.8 C3.6 6 4.6 8.4 7 9.6 Z" fill="#93592c"/>
  <path d="M11.4 8 L15.4 3.6 C16.4 6 15.4 8.4 12.8 9.4 Z" fill="#93592c"/>
  <path d="M8 8.6 L5.4 5.4 C5.2 7 6 8.4 7.4 9.2 Z" fill="#e3b49a"/>
  <path d="M12 8.4 L14.6 5.2 C15 6.8 14.2 8.2 12.8 9 Z" fill="#e3b49a"/>
  <!-- eye -->
  <rect x="8.4" y="9.6" width="1.6" height="1.6" fill="#12181e"/>
  <rect x="8.4" y="9.6" width="0.8" height="0.8" fill="#f6f6f2"/>
</svg>
