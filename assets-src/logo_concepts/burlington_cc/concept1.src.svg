<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Burlington CC - Concept 1: Sugaring Season</title>
  <defs>
    <clipPath id="bucket"><path d="M11 13 L29 13 L27.4 30 L12.6 30 Z"/></clipPath>
    <clipPath id="trunk"><rect x="2" y="2" width="7" height="28"/></clipPath>
  </defs>
  <!-- a sugar maple's grey trunk, lit on the left, with furrowed bark -->
  <rect x="2" y="2" width="7" height="28" fill="#7a6d62"/>
  <rect x="2" y="2" width="2.2" height="28" fill="#9c8f82"/>
  <rect x="6.8" y="2" width="2.2" height="28" fill="#584d45"/>
  <g fill="#584d45" clip-path="url(#trunk)">
    <rect x="4.6" y="3" width="1" height="5"/><rect x="3" y="16" width="1" height="6"/><rect x="5.4" y="21" width="1" height="7"/>
  </g>
  <!-- the spile -->
  <rect x="8.6" y="10.4" width="4.4" height="1.6" fill="#6b747a"/>
  <!-- three golf balls heaped in the bucket in place of sap, each with its own rim and shade -->
  <circle cx="15.4" cy="10.6" r="3.4" fill="#8f8e86"/>
  <circle cx="15.4" cy="10.6" r="2.8" fill="#d6d5cc"/>
  <circle cx="14.9" cy="10.1" r="2.2" fill="#f4f3ec"/>
  <circle cx="22.2" cy="10.6" r="3.4" fill="#8f8e86"/>
  <circle cx="22.2" cy="10.6" r="2.8" fill="#d6d5cc"/>
  <circle cx="21.7" cy="10.1" r="2.2" fill="#f4f3ec"/>
  <circle cx="18.8" cy="6.4" r="3.4" fill="#8f8e86"/>
  <circle cx="18.8" cy="6.4" r="2.8" fill="#d6d5cc"/>
  <circle cx="18.3" cy="5.9" r="2.2" fill="#f4f3ec"/>
  <g fill="#d6d5cc">
    <rect x="18.8" y="6.6" width="1" height="1"/><rect x="15.6" y="10.8" width="1" height="1"/><rect x="22.4" y="10.8" width="1" height="1"/>
  </g>
  <!-- the galvanised sap bucket, lit left, shaded right, two hoops -->
  <path d="M11 13 L29 13 L27.4 30 L12.6 30 Z" fill="#a9b2b8"/>
  <rect x="11" y="13" width="5" height="17" fill="#c9d0d4" clip-path="url(#bucket)"/>
  <rect x="23" y="13" width="6" height="17" fill="#7f898f" clip-path="url(#bucket)"/>
  <rect x="10.6" y="13" width="18.8" height="1.6" fill="#f4f3ec"/>
  <rect x="11" y="17.6" width="18" height="1.2" fill="#6b747a" clip-path="url(#bucket)"/>
  <rect x="11" y="25.6" width="18" height="1.2" fill="#6b747a" clip-path="url(#bucket)"/>
  <!-- a scarlet sugar maple leaf -->
  <path d="M26.6 2.2 L27.6 4 L29.6 3.4 L29 5.4 L30 6.2 L28.3 6.9 L28.6 8.2 L27.1 7.7 L26.6 9.2 L26.1 7.7 L24.6 8.2 L24.9 6.9 L23.2 6.2 L24.2 5.4 L23.6 3.4 L25.6 4 Z" fill="#cf3b1b"/>
  <path d="M26.6 2.2 L27.6 4 L26.6 6 L25.6 4 Z M23.6 3.4 L25.6 4 L26.6 6 L24.2 5.4 Z" fill="#f07a32"/>
</svg>
