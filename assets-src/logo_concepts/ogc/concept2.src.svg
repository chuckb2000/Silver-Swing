<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Oregon Golf Club - Concept 2: Oregon Grape</title>
  <defs>
    <!-- a holly-like leaflet: long, with big spiny teeth -->
    <path id="leaflet" d="M0 -5 L1.2 -3.6 L2.8 -3.8 L2.2 -1.8 L3.6 -1 L2.2 0.2 L3 1.8 L1.4 1.8 L1 3.6 L0 2.8 L-1 3.6 L-1.4 1.8 L-3 1.8 L-2.2 0.2 L-3.6 -1 L-2.2 -1.8 L-2.8 -3.8 L-1.2 -3.6 Z"/>
  </defs>
  <!-- one compound leaf rising to the upper right behind the fruit -->
  <path d="M12 20 L25 7" stroke="#5a3a20" stroke-width="1.2" fill="none"/>
  <g fill="#2f6a3a">
    <use href="#leaflet" transform="translate(25.2 6.6) rotate(45)"/>
    <use href="#leaflet" transform="translate(19 7.4) rotate(-20)"/>
    <use href="#leaflet" transform="translate(25.6 13.4) rotate(110)"/>
    <use href="#leaflet" transform="translate(13.6 12) rotate(-30)"/>
    <use href="#leaflet" transform="translate(21.8 18.4) rotate(120)"/>
  </g>
  <g fill="#4f8f4a">
    <use href="#leaflet" transform="translate(18.6 7) rotate(-20) scale(0.5)"/>
    <use href="#leaflet" transform="translate(13.2 11.6) rotate(-30) scale(0.5)"/>
    <use href="#leaflet" transform="translate(24.8 6.2) rotate(45) scale(0.5)"/>
  </g>
  <rect x="27.2" y="15.4" width="1.2" height="1.2" fill="#a8302a"/>
  <rect x="24" y="20.6" width="1.2" height="1.2" fill="#a8302a"/>
  <!-- the berries: dusty blue-purple, a hanging bunch -->
  <g fill="#3e3e7a">
    <circle cx="8.6" cy="17.6" r="2.5"/><circle cx="13.2" cy="18.4" r="2.5"/>
    <circle cx="6.6" cy="21.8" r="2.5"/><circle cx="11.2" cy="22.4" r="2.5"/><circle cx="15.4" cy="22.6" r="2.3"/>
    <circle cx="8.6" cy="26" r="2.4"/><circle cx="13" cy="26.4" r="2.3"/>
    <circle cx="10.6" cy="29" r="1.6"/>
  </g>
  <g fill="#7a7ab8">
    <rect x="7.2" y="16.2" width="1.4" height="1.2"/><rect x="11.8" y="17" width="1.4" height="1.2"/>
    <rect x="5.2" y="20.4" width="1.4" height="1.2"/><rect x="9.8" y="21" width="1.4" height="1.2"/>
    <rect x="7.2" y="24.6" width="1.4" height="1.2"/><rect x="14" y="21.2" width="1.2" height="1.2"/>
  </g>
  <g fill="#262650">
    <rect x="14.4" y="19.8" width="1.2" height="1.2"/><rect x="16.2" y="23.6" width="1.2" height="1.2"/>
    <rect x="13.6" y="27.6" width="1.2" height="1"/><rect x="11.8" y="23.6" width="1.2" height="1.2"/>
  </g>
</svg>
