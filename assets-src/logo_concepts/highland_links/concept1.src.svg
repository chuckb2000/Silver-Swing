<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Highland Links - Concept 1: Highland Light by Night</title>
  <defs>
    <clipPath id="disc"><circle cx="16" cy="16" r="13.6"/></clipPath>
    <clipPath id="right"><rect x="16" y="0" width="16" height="32"/></clipPath>
    <path id="tower" d="M13.4 12.6 L18.6 12.6 L20 25 L12 25 Z"/>
  </defs>
  <circle cx="16" cy="16" r="14.9" fill="#0d1f3a"/>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="32" height="32" fill="#1c3a6a"/>
    <!-- the beams, swept out over the sea -->
    <path d="M16 8.4 L0 3 L0 11.4 Z" fill="#f6e3a0"/>
    <path d="M16 8.4 L32 4.6 L32 10.8 Z" fill="#c9b878"/>
    <!-- the sea, far below -->
    <rect x="0" y="22" width="32" height="10" fill="#14305a"/>
    <!-- the sand bluff and its heath -->
    <path d="M0 24 L32 24 L32 32 L0 32 Z" fill="#d8b884"/>
    <path d="M22 24 L32 24 L32 32 L24 32 Z" fill="#b8955e"/>
    <path d="M0 23.4 C8 22.4 24 22.4 32 23.4 L32 25 L0 25 Z" fill="#6a7a3a"/>
  </g>
  <!-- the tower: white cone, black lantern and gallery -->
  <use href="#tower" fill="#f6f6f2"/>
  <use href="#tower" fill="#cfd6dc" clip-path="url(#right)"/>
  <rect x="15.4" y="18" width="1.2" height="1.6" fill="#1d1a18"/>
  <rect x="15.2" y="22.6" width="1.6" height="2.4" fill="#1d1a18"/>
  <rect x="12.2" y="11.6" width="7.6" height="1.4" fill="#1d1a18"/>
  <rect x="13.6" y="7" width="4.8" height="4.8" fill="#1d1a18"/>
  <rect x="14.4" y="7.8" width="3.2" height="3" fill="#ffd84a"/>
  <path d="M13.4 7.2 C13.4 4.6 18.6 4.6 18.6 7.2 Z" fill="#1d1a18"/>
  <rect x="15.6" y="3.2" width="0.8" height="2" fill="#1d1a18"/>
</svg>
