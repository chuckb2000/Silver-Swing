<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Bandon Dunes - Concept 1: The Harbor Seal</title>
  <defs>
    <clipPath id="right"><rect x="16" y="0" width="16" height="32"/></clipPath>
    <clipPath id="sea"><ellipse cx="16" cy="26.4" rx="14.4" ry="3.6"/></clipPath>
    <g id="head">
      <circle cx="16" cy="12.6" r="9.4"/>
      <path d="M7 14 L5.8 25.6 L26.2 25.6 L25 14 Z"/>
    </g>
  </defs>
  <!-- the sea behind -->
  <ellipse cx="16" cy="26.4" rx="14.4" ry="3.6" fill="#2d6aa8"/>
  <!-- a harbor seal, head up out of the water, looking at you -->
  <use href="#head" fill="#8d96a0"/>
  <use href="#head" fill="#6b7480" clip-path="url(#right)"/>
  <path d="M8.8 8.4 C10.4 5.2 13.6 3.6 16.4 3.4 L16 5.2 C13.2 5.4 11 6.8 9.8 9.2 Z" fill="#b9c1c9"/>
  <!-- spots -->
  <g fill="#4f5862">
    <rect x="9" y="17.6" width="1.2" height="1.2"/><rect x="21.6" y="18.6" width="1.2" height="1.2"/>
    <rect x="11.2" y="5.8" width="1.2" height="1.2"/><rect x="22.8" y="9.6" width="1.2" height="1.2"/>
    <rect x="7.8" y="21.8" width="1.2" height="1.2"/><rect x="23.6" y="22.6" width="1.2" height="1.2"/>
  </g>
  <!-- big dark eyes with a glint -->
  <ellipse cx="11.8" cy="11.4" rx="2" ry="2.4" fill="#12181e"/>
  <ellipse cx="20.2" cy="11.4" rx="2" ry="2.4" fill="#12181e"/>
  <rect x="10.6" y="10" width="1.2" height="1.2" fill="#f6f6f2"/>
  <rect x="19" y="10" width="1.2" height="1.2" fill="#f6f6f2"/>
  <!-- muzzle, nose, whiskers -->
  <ellipse cx="16" cy="17.2" rx="4.8" ry="3" fill="#c3cad1"/>
  <path d="M14.4 14.8 L17.6 14.8 L16 16.6 Z" fill="#12181e"/>
  <rect x="15.4" y="16.4" width="1.2" height="1.6" fill="#4f5862"/>
  <g stroke="#e6e9ec" stroke-width="1" fill="none">
    <path d="M11.6 16.4 L7.2 15.6"/><path d="M11.6 18.2 L7.4 19"/>
    <path d="M20.4 16.4 L24.8 15.6"/><path d="M20.4 18.2 L24.6 19"/>
  </g>
  <!-- the waterline: foam, then the near water -->
  <ellipse cx="16" cy="25.4" rx="11.6" ry="1.8" fill="#f6f6f2"/>
  <path d="M1.6 26.4 C6 27.6 26 27.6 30.4 26.4 C29.6 28.4 24 30 16 30 C8 30 2.4 28.4 1.6 26.4 Z" fill="#1f4f86"/>
  <rect x="9" y="27.6" width="4" height="1" fill="#5d97ee"/>
  <rect x="19.4" y="28" width="3.4" height="1" fill="#5d97ee"/>
</svg>
