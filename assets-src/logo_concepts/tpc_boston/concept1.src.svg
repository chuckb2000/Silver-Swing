<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>TPC Boston - Concept 1: Lederhosen, Sunday Best</title>
  <defs>
    <clipPath id="right"><rect x="16" y="0" width="16" height="32"/></clipPath>
    <g id="pants">
      <!-- short trousers with a front flap -->
      <path d="M6.4 14.6 L25.6 14.6 L27.6 28.6 L18.6 28.6 L16 21.4 L13.4 28.6 L4.4 28.6 Z"/>
      <!-- the H of the braces with its chest bar -->
      <rect x="8.6" y="2.4" width="3" height="12.6"/>
      <rect x="20.4" y="2.4" width="3" height="12.6"/>
      <rect x="10" y="6.4" width="12" height="3.6"/>
    </g>
  </defs>
  <use href="#pants" fill="#8ec4ec"/>
  <use href="#pants" fill="#5f9ccc" clip-path="url(#right)"/>
  <rect x="6.4" y="14.6" width="19.2" height="1.6" fill="#3f6f9c"/>
  <rect x="8.6" y="2.4" width="1" height="12" fill="#c0e0f8"/>
  <rect x="4.6" y="26.6" width="8.6" height="2" fill="#3f6f9c"/>
  <rect x="18.8" y="26.6" width="8.6" height="2" fill="#3f6f9c"/>
  <!-- embroidered flap (Hosenlatz) and an edelweiss on the chest bar -->
  <path d="M11.4 16.6 L20.6 16.6 L20.6 20 C18.6 21.6 13.4 21.6 11.4 20 Z" fill="#c0e0f8"/>
  <path d="M13 17.6 C14.6 19.2 17.4 19.2 19 17.6" stroke="#3f6f9c" stroke-width="1" fill="none"/>
  <g fill="#f6f6f2">
    <rect x="15.4" y="6.6" width="1.2" height="3.2"/><rect x="14.4" y="7.6" width="3.2" height="1.2"/>
  </g>
  <rect x="15.4" y="7.6" width="1.2" height="1.2" fill="#ffd84a"/>
  <!-- staghorn buttons -->
  <g fill="#e3c99a">
    <rect x="9.6" y="15.4" width="1.6" height="1.6"/><rect x="20.8" y="15.4" width="1.6" height="1.6"/>
    <rect x="11.6" y="19.6" width="1.4" height="1.4"/><rect x="19" y="19.6" width="1.4" height="1.4"/>
  </g>
  <!-- side seams -->
  <rect x="6" y="18" width="1" height="6" fill="#3f6f9c"/><rect x="25" y="18" width="1" height="6" fill="#3f6f9c"/>
</svg>
