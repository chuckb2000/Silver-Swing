<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Pacific Dunes - Concept 2: The Sand Wave</title>
  <defs>
    <clipPath id="dune"><path d="M2.8 28 L29.2 28 C29.2 22 27.6 12 22.8 7 C20 4.2 14.6 3.4 11 6 C8.6 7.8 8 10.6 9.6 12.6 C10.6 11.2 12.2 10.6 13.8 11.6 C15.2 12.8 15 15.6 13 18.4 C10.6 21.8 6.4 25.6 2.8 28 Z"/></clipPath>
  </defs>
  <!-- a strip of the Pacific under the curl -->
  <path d="M2 29 L2 24.6 C4 23.4 7 23.4 9 24.4 C11 25.4 13 25 15 24 L15 29 Z" fill="#2d6aa8"/>
  <path d="M2 24.6 C4 23.4 7 23.4 9 24.4 C11 25.4 13 25 15 24 L15 25.2 C13 26.2 11 26.6 9 25.6 C7 24.6 4 24.6 2 25.8 Z" fill="#f6f6f2"/>
  <rect x="2" y="27.6" width="13" height="1.4" fill="#1f4f86"/>
  <!-- the dune, shaped as a breaking wave -->
  <path d="M2.8 28 L29.2 28 C29.2 22 27.6 12 22.8 7 C20 4.2 14.6 3.4 11 6 C8.6 7.8 8 10.6 9.6 12.6 C10.6 11.2 12.2 10.6 13.8 11.6 C15.2 12.8 15 15.6 13 18.4 C10.6 21.8 6.4 25.6 2.8 28 Z" fill="#e7c98f"/>
  <g clip-path="url(#dune)">
    <!-- the back slope in shade -->
    <path d="M18 28 C19 20 21.6 12 25.4 8 L32 8 L32 28 Z" fill="#c9a066"/>
    <!-- the lit lip of the crest -->
    <path d="M9.4 8.4 C11.4 5.4 16 4.6 20.4 6 L20 7.4 C16.2 6.2 12.4 7 10.4 9.6 Z" fill="#f6e3b8"/>
    <!-- wind ripples on the face -->
    <path d="M6 26 C9 23.6 12 22.4 15.4 22.2" stroke="#f6e3b8" stroke-width="1" fill="none"/>
    <path d="M13 26.6 C16 25 18.6 24.6 21 24.8" stroke="#d8b47a" stroke-width="1" fill="none"/>
  </g>
  <!-- fescue tufts on the back of the dune -->
  <g fill="#8a8a36">
    <path d="M21.4 9.6 L22.4 5.6 L23 9.4 L24.4 6.2 L24.2 10.2 Z"/>
    <path d="M25.6 15.4 L26.6 11.6 L27.2 15.2 L28.6 12.4 L28.2 16 Z"/>
    <path d="M24.2 21.6 L25.2 18 L25.8 21.4 L27.2 18.6 L26.8 22.2 Z"/>
  </g>
  <g fill="#b8b04e">
    <path d="M21.6 9.6 L22.4 5.6 L22.6 9.6 Z"/>
    <path d="M25.8 15.4 L26.6 11.6 L26.8 15.4 Z"/>
    <path d="M24.4 21.6 L25.2 18 L25.4 21.6 Z"/>
  </g>
</svg>
