    <rect x="1" y="11.4" width="20" height="3.6" fill="#efe3c8"/>
    <g fill="#2a3a48"><rect x="2.4" y="12" width="2.4" height="2.6"/><rect x="6" y="12" width="2.4" height="2.6"/><rect x="9.6" y="12" width="2.4" height="2.6"/><rect x="13.2" y="12" width="2.4" height="2.6"/><rect x="16.8" y="12" width="2.4" height="2.6"/></g>
    <rect x="14" y="15" width="7" height="3.8" fill="#5a1824"/>
    <g fill="#2a2a30"><circle cx="4.6" cy="19.2" r="1.3"/><circle cx="8" cy="19.2" r="1.3"/><circle cx="14" cy="19.2" r="1.3"/><circle cx="17.4" cy="19.2" r="1.3"/></g>
    <path d="M14.6 10 L19.6 6.8" stroke="#2a2a30" stroke-width="1.2"/>
