    <ellipse cx="23" cy="25.6" rx="6.6" ry="2.6" fill="#7ccf5e"/>
    <rect x="0" y="19.6" width="32" height="0.9" fill="#8a8f96"/>
    <!-- a maroon-and-cream car on the line -->
