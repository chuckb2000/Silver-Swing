<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Waverley - Trolley C: Along the Line (side view over the turf)</title>
  <defs>
    <clipPath id="body"><path d="M4.6 10.6 L27.4 10.6 C28.8 10.6 29.6 11.6 29.6 13 L29.6 21.4 L2.4 21.4 L2.4 13.4 C2.4 11.8 3.2 10.6 4.6 10.6 Z"/></clipPath>
  </defs>
  <!-- wire, and the pole trailing back to it -->
  <rect x="1.6" y="2.6" width="28.8" height="1" fill="#2a2a30"/>
  <path d="M21.4 8.6 L27 3.4" stroke="#2a2a30" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="26.2" y="2.4" width="2" height="1.6" fill="#2a2a30"/>
  <!-- roof with clerestory -->
  <path d="M3.6 10.8 C4 9.4 5 8.6 6.4 8.6 L25.6 8.6 C27 8.6 28 9.4 28.4 10.8 Z" fill="#1f3a22"/>
  <rect x="7" y="7.4" width="18" height="1.4" fill="#1f3a22"/>
  <!-- the car: green below, cream round the windows -->
  <path d="M4.6 10.6 L27.4 10.6 C28.8 10.6 29.6 11.6 29.6 13 L29.6 21.4 L2.4 21.4 L2.4 13.4 C2.4 11.8 3.2 10.6 4.6 10.6 Z" fill="#3f8a3a"/>
  <g clip-path="url(#body)">
    <rect x="0" y="10.6" width="32" height="6.2" fill="#efe3c8"/>
    <rect x="0" y="16.8" width="32" height="1" fill="#2f6a2e"/>
    <rect x="0" y="19.6" width="32" height="2" fill="#2f6a2e"/>
  </g>
  <g fill="#2a3a48">
    <rect x="3.6" y="11.8" width="2.4" height="3.8"/><rect x="7.4" y="11.8" width="3" height="3.8"/><rect x="11.6" y="11.8" width="3" height="3.8"/>
    <rect x="15.8" y="11.8" width="3" height="3.8"/><rect x="20" y="11.8" width="3" height="3.8"/><rect x="24.2" y="11.8" width="3" height="3.8"/>
  </g>
  <g fill="#8fb0c8"><rect x="7.6" y="12" width="1" height="2"/><rect x="11.8" y="12" width="1" height="2"/><rect x="16" y="12" width="1" height="2"/><rect x="20.2" y="12" width="1" height="2"/></g>
  <!-- door, headlight -->
  <rect x="27.6" y="11.8" width="1.6" height="9.6" fill="#2f6a2e"/>
  <rect x="1.8" y="17.6" width="1.4" height="1.6" fill="#ffd84a"/>
  <!-- trucks and wheels -->
  <g fill="#2a2a30">
    <rect x="4.6" y="21.4" width="7" height="1.6"/><rect x="20.4" y="21.4" width="7" height="1.6"/>
    <circle cx="6.4" cy="23.4" r="1.6"/><circle cx="9.8" cy="23.4" r="1.6"/><circle cx="22.2" cy="23.4" r="1.6"/><circle cx="25.6" cy="23.4" r="1.6"/>
  </g>
  <!-- the line runs across the links -->
  <rect x="1.6" y="24.6" width="28.8" height="1" fill="#8a8f96"/>
  <rect x="1.6" y="25.6" width="28.8" height="3.8" fill="#5fa04a"/>
  <rect x="1.6" y="27.4" width="28.8" height="2" fill="#4f8f4a"/>
</svg>
