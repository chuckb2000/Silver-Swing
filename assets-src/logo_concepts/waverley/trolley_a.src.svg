<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Waverley - Trolley A: Head-On, in the line's maroon and cream</title>
  <defs>
    <clipPath id="right"><rect x="16" y="0" width="16" height="32"/></clipPath>
    <g id="car">
      <path d="M6 10.6 C7.6 7.8 11.4 6.4 16 6.4 C20.6 6.4 24.4 7.8 26 10.6 L26 24.4 L6 24.4 Z"/>
    </g>
  </defs>
  <!-- the overhead wire and the trolley pole reaching up to it -->
  <rect x="2.4" y="2" width="27.2" height="1" fill="#5a5a64"/>
  <path d="M16.4 7 L19.6 2.8" stroke="#2a2a30" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="18.8" y="1.8" width="2" height="1.6" fill="#2a2a30"/>
  <!-- body -->
  <use href="#car" fill="#7a2230"/>
  <use href="#car" fill="#5a1824" clip-path="url(#right)"/>
  <!-- arched roof with a clerestory, a lit left edge -->
  <path d="M6 10.6 C7.6 7.8 11.4 6.4 16 6.4 C20.6 6.4 24.4 7.8 26 10.6 L24.4 10.6 C22.8 8.8 19.8 8 16 8 C12.2 8 9.2 8.8 7.6 10.6 Z" fill="#3a2a2a"/>
  <path d="M7.6 9.4 C9.4 7.6 12.4 6.8 16 6.8 L16 7.6 C12.6 7.6 10 8.2 8.4 9.8 Z" fill="#5a4a4a"/>
  <!-- destination sign -->
  <rect x="12.6" y="8.6" width="6.8" height="1.8" fill="#efe3c8"/>
  <rect x="13.4" y="9.2" width="5.2" height="0.7" fill="#2a2a30"/>
  <!-- three front windows -->
  <g fill="#2a3a48">
    <rect x="7.4" y="11.4" width="4.6" height="5.4"/><rect x="13.6" y="11.4" width="4.8" height="5.4"/><rect x="20" y="11.4" width="4.6" height="5.4"/>
  </g>
  <g fill="#8fb0c8"><rect x="7.8" y="11.8" width="1.2" height="3"/><rect x="14" y="11.8" width="1.2" height="3"/><rect x="20.4" y="11.8" width="1.2" height="3"/></g>
  <!-- cream belt rail, the dash below -->
  <rect x="6" y="17.4" width="20" height="1.8" fill="#efe3c8"/>
  <!-- headlight -->
  <circle cx="16" cy="21.6" r="2" fill="#2a2a30"/>
  <circle cx="16" cy="21.6" r="1.3" fill="#ffd84a"/>
  <rect x="15.2" y="20.8" width="0.8" height="0.8" fill="#efe3c8"/>
  <!-- bumper and fender -->
  <rect x="5" y="24.4" width="22" height="1.4" fill="#2a2a30"/>
  <path d="M7 25.8 L25 25.8 L23.4 27.6 L8.6 27.6 Z" fill="#5a5a64"/>
  <g fill="#2a2a30"><rect x="11" y="25.8" width="1" height="1.8"/><rect x="15.5" y="25.8" width="1" height="1.8"/><rect x="20" y="25.8" width="1" height="1.8"/></g>
  <!-- the rails underfoot -->
  <rect x="3" y="28.2" width="26" height="1.2" fill="#8a7a62"/>
  <rect x="8" y="27.8" width="2.4" height="1" fill="#8a8f96"/><rect x="21.6" y="27.8" width="2.4" height="1" fill="#8a8f96"/>
</svg>
