<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Waverley - Trolley E: The Live Wire (pole, wheel and spark)</title>
  <defs>
    <clipPath id="disc"><circle cx="16" cy="16" r="13.6"/></clipPath>
  </defs>
  <circle cx="16" cy="16" r="14.9" fill="#efe3c8"/>
  <circle cx="16" cy="16" r="13.6" fill="#1f3a22"/>
  <g clip-path="url(#disc)">
    <!-- the overhead wire -->
    <rect x="0" y="9.4" width="32" height="1.4" fill="#cfd6dc"/>
    <!-- the trolley pole rising from the bottom left, its harp and wheel on the wire -->
    <path d="M5 30 L19.6 12.4" stroke="#efe3c8" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 30 L19.6 12.4" stroke="#b8ab88" stroke-width="0.8" transform="translate(0.6 0.4)"/>
    <path d="M18.4 13.6 L19.4 10.8 L22.2 10.8 L21.6 13.8 Z" fill="#b8ab88"/>
    <circle cx="20.8" cy="10.2" r="1.8" fill="#4a4a52"/>
    <circle cx="20.8" cy="10.2" r="0.8" fill="#cfd6dc"/>
  </g>
  <!-- the spark where wheel meets wire -->
  <path d="M23.4 6 L24.4 8.6 L27.2 8 L25 9.8 L26.8 12 L24.2 11.2 L23.4 13.8 L22.8 11.2 L20.4 12 L22 9.8 L20 8 L22.6 8.6 Z" fill="#ffd84a"/>
  <path d="M23.2 8.4 L24 9.6 L23.4 10.8 L22.6 9.6 Z" fill="#fff6c8"/>
</svg>
