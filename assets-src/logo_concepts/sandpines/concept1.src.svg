<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Sandpines - Concept 1: The Siuslaw Bridge</title>
  <defs>
    <g id="tower">
      <!-- an Art Deco obelisk: fluted shaft, stepped crown, pyramid cap -->
      <rect x="-2.2" y="8" width="4.4" height="15"/>
      <rect x="-2.8" y="7" width="5.6" height="1.6"/>
      <rect x="-1.8" y="5.2" width="3.6" height="2"/>
      <path d="M-1.8 5.2 L0 2.2 L1.8 5.2 Z"/>
    </g>
  </defs>
  <!-- the river -->
  <path d="M1.6 22 L30.4 22 L30.4 27 C24 29.6 8 29.6 1.6 27 Z" fill="#2d6aa8"/>
  <rect x="1.6" y="25" width="28.8" height="1" fill="#5d97ee"/>
  <!-- tied concrete arches either side of the drawspan -->
  <g fill="none" stroke="#e9e2cf" stroke-width="1.8">
    <path d="M2 17 C2.6 11.6 5 9.4 7.4 9.4"/>
    <path d="M30 17 C29.4 11.6 27 9.4 24.6 9.4"/>
  </g>
  <g fill="#c2b89c">
    <rect x="3.4" y="12.4" width="1" height="4.6"/><rect x="5.6" y="10.4" width="1" height="6.6"/>
    <rect x="27.6" y="12.4" width="1" height="4.6"/><rect x="25.4" y="10.4" width="1" height="6.6"/>
  </g>
  <!-- deck -->
  <rect x="1.6" y="16.4" width="28.8" height="2.6" fill="#e9e2cf"/>
  <rect x="1.6" y="18.2" width="28.8" height="0.8" fill="#8f8670"/>
  <rect x="15.6" y="16.4" width="0.8" height="2.6" fill="#8f8670"/>
  <!-- piers -->
  <rect x="7.6" y="19" width="3.6" height="5.4" fill="#c2b89c"/>
  <rect x="20.8" y="19" width="3.6" height="5.4" fill="#c2b89c"/>
  <!-- the four obelisks, two seen from the side -->
  <use href="#tower" transform="translate(9.4 0)" fill="#e9e2cf"/>
  <use href="#tower" transform="translate(22.6 0)" fill="#e9e2cf"/>
  <rect x="10.2" y="5.2" width="1.4" height="17.8" fill="#c2b89c"/>
  <rect x="23.4" y="5.2" width="1.4" height="17.8" fill="#c2b89c"/>
  <rect x="9" y="10" width="0.9" height="4.4" fill="#4a4a52"/>
  <rect x="22.2" y="10" width="0.9" height="4.4" fill="#4a4a52"/>
  <rect x="7.6" y="22.4" width="3.6" height="1" fill="#1f4f86"/>
  <rect x="20.8" y="22.4" width="3.6" height="1" fill="#1f4f86"/>
</svg>
