    <clipPath id="bulb"><circle cx="19.4" cy="17.6" r="8.6"/></clipPath>
  </defs>
  <!-- the iron ring stand -->
  <rect x="12" y="27.6" width="15.6" height="1.8" fill="#4a4a52"/>
  <rect x="12.4" y="24.4" width="1.4" height="3.4" fill="#4a4a52"/><rect x="25.6" y="24.4" width="1.4" height="3.4" fill="#4a4a52"/>
  <!-- the long neck: up from the crown of the bulb, then down and away, tapering -->
  <path d="M15.4 10.6 C14.6 7 11.6 5.2 8.6 6.8 C6.4 8 5 11 4 15 L2.6 22.4 L3.8 22.6 L5.4 15.4 C6.4 12 7.6 9.6 9.4 8.8 C11.6 7.8 13.2 9.2 13.8 11.6 Z" fill="#cfe3f2"/>
  <path d="M8.6 6.8 C6.4 8 5 11 4 15 L2.6 22.4 L3.2 22.4 L4.6 15.2 C5.6 11.4 6.8 9 8.8 7.8 Z" fill="#f6f6f2"/>
