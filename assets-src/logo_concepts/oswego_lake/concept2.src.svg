  <path d="M19 6 L21.5 6 L26 29 L22.5 29 Z" fill="#4b5059"/>
  <path d="M10.5 6 L11.6 6 L7.2 29 L6 29 Z" fill="#8d939b"/>
  <!-- mortar courses -->
  <g fill="#3a3e46" clip-path="url(#stack)">
    <rect x="0" y="11" width="32" height="1"/>
    <rect x="0" y="16" width="32" height="1"/>
    <rect x="0" y="21" width="32" height="1"/>
    <rect x="0" y="26" width="32" height="1"/>
  </g>
  <!-- the cap -->
  <rect x="9.6" y="4.6" width="12.8" height="2" fill="#3a3e46"/>
  <rect x="9.6" y="4.6" width="12.8" height="1" fill="#6b7079"/>
  <!-- Gothic arch, glowing -->
  <path d="M11.6 29 L11.6 21 Q11.6 16.6 16 13.4 Q20.4 16.6 20.4 21 L20.4 29 Z" fill="#2a1d18"/>
  <path d="M13 29 L13 21.6 Q13 18.6 16 16.2 Q19 18.6 19 21.6 L19 29 Z" fill="#e8681e"/>
  <path d="M14.4 29 L14.4 23.4 Q14.4 21.6 16 20.2 Q17.6 21.6 17.6 23.4 L17.6 29 Z" fill="#ffd84a"/>
  <!-- embers rising -->
