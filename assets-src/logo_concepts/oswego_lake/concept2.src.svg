<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Oswego Lake - Concept 2: The Iron Furnace</title>
  <defs>
    <clipPath id="stack"><path d="M10.5 6 L21.5 6 L26 29 L6 29 Z"/></clipPath>
  </defs>
  <!-- the stone stack: a truncated pyramid -->
