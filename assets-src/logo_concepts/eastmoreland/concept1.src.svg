<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Eastmoreland - Concept 1: The Rhododendron Rosette</title>
  <!-- a whorl of glossy leaves, seen from above -->
  <g fill="#2f6a3a">
    <ellipse cx="20.1" cy="7.3" rx="5.4" ry="2.4" transform="rotate(-65 20.1 7.3)"/>
    <ellipse cx="25.3" cy="13.7" rx="5.4" ry="2.4" transform="rotate(-13.6 25.3 13.7)"/>
    <ellipse cx="23.6" cy="21.9" rx="5.4" ry="2.4" transform="rotate(37.9 23.6 21.9)"/>
    <ellipse cx="16.1" cy="25.6" rx="5.4" ry="2.4" transform="rotate(89.3 16.1 25.6)"/>
    <ellipse cx="8.6" cy="22.1" rx="5.4" ry="2.4" transform="rotate(140.7 8.6 22.1)"/>
    <ellipse cx="6.6" cy="14" rx="5.4" ry="2.4" transform="rotate(192.1 6.6 14)"/>
    <ellipse cx="11.7" cy="7.4" rx="5.4" ry="2.4" transform="rotate(243.6 11.7 7.4)"/>
  </g>
  <!-- the lit upper-left leaves -->
  <g fill="#4f8f4a">
    <ellipse cx="6.4" cy="13.6" rx="3.4" ry="1" transform="rotate(192.1 6.4 13.6)"/>
    <ellipse cx="11.4" cy="7" rx="3.4" ry="1" transform="rotate(243.6 11.4 7)"/>
    <ellipse cx="19.8" cy="6.8" rx="3.4" ry="1" transform="rotate(-65 19.8 6.8)"/>
  </g>
  <!-- the truss: a dome of bell flowers -->
  <g fill="#c8457f">
    <circle cx="16" cy="10.8" r="3.4"/><circle cx="20.5" cy="13.4" r="3.4"/><circle cx="20.5" cy="18.6" r="3.4"/>
    <circle cx="16" cy="21.2" r="3.4"/><circle cx="11.5" cy="18.6" r="3.4"/><circle cx="11.5" cy="13.4" r="3.4"/>
  </g>
  <g fill="#ef7fb0">
    <circle cx="15.6" cy="10.4" r="2.6"/><circle cx="20" cy="13" r="2.6"/><circle cx="20" cy="18.2" r="2.4"/>
    <circle cx="15.6" cy="20.6" r="2.4"/><circle cx="11.1" cy="18.2" r="2.6"/><circle cx="11.1" cy="13" r="2.6"/>
    <circle cx="16" cy="16" r="3.4"/>
  </g>
  <g fill="#f9c0d8">
    <rect x="14.2" y="9" width="1.4" height="1.2"/><rect x="9.8" y="11.6" width="1.4" height="1.2"/>
    <rect x="9.8" y="16.8" width="1.4" height="1.2"/><rect x="14.6" y="14.6" width="1.4" height="1.2"/>
  </g>
  <!-- freckled throats -->
  <g fill="#8a2a5a">
    <rect x="16" y="11" width="1" height="1"/><rect x="20.4" y="13.6" width="1" height="1"/><rect x="20.4" y="18.8" width="1" height="1"/>
    <rect x="16" y="21.2" width="1" height="1"/><rect x="11.6" y="18.8" width="1" height="1"/><rect x="11.6" y="13.6" width="1" height="1"/>
    <rect x="16.4" y="16.4" width="1" height="1"/>
  </g>
</svg>
