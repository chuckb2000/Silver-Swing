<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Bandon Preserve - Concept 1: The Snowy Plover</title>
  <defs>
    <clipPath id="body"><ellipse cx="17" cy="16.8" rx="10.2" ry="7"/></clipPath>
    <clipPath id="head"><circle cx="9.8" cy="9.8" r="5"/></clipPath>
  </defs>
  <!-- sand, with the last of a wave -->
  <ellipse cx="16" cy="27.6" rx="13.4" ry="2.6" fill="#e7c98f"/>
  <path d="M2.6 27.6 C8 25.4 24 25.4 29.4 27.6 L29.4 28.6 C24 26.6 8 26.6 2.6 28.6 Z" fill="#f6f6f2"/>
  <path d="M18 28.6 C22 28.4 26 28.4 29.2 28.2 C28 29.4 24 30 20 30 Z" fill="#c9a066"/>
  <!-- legs -->
  <rect x="14.4" y="22" width="1.2" height="4.6" fill="#4a525c"/>
  <rect x="18.4" y="22" width="1.2" height="4.6" fill="#4a525c"/>
  <rect x="13.4" y="26" width="2.4" height="1" fill="#4a525c"/>
  <rect x="17.4" y="26" width="2.4" height="1" fill="#4a525c"/>
  <!-- round body: pale sandy back, white underparts -->
  <ellipse cx="17" cy="16.8" rx="10.2" ry="7" fill="#f6f6f2"/>
  <g clip-path="url(#body)">
    <path d="M6 14.6 C10 11 20 10 28 14 L28 18.4 C22 17 14 16.8 6 18 Z" fill="#cdb48c"/>
    <path d="M14 12 C19 11 24 12 28 14 L28 18.4 C24 17.6 19 17.2 15 17.2 Z" fill="#a98f68"/>
    <path d="M17 15.8 C20 15 24 15.4 27.6 16.6" stroke="#8a7354" stroke-width="1" fill="none"/>
    <rect x="0" y="21.4" width="32" height="3" fill="#dfe3e6"/>
  </g>
  <!-- tail -->
  <path d="M26.4 14.4 L30 15.2 L26.6 17.4 Z" fill="#8a7354"/>
  <!-- head -->
  <circle cx="9.8" cy="9.8" r="5" fill="#f6f6f2"/>
  <g clip-path="url(#head)">
    <path d="M4 7 C6 4 12 3.6 15 6.6 L15 9.6 C12 8.4 9 8 6.8 8.6 Z" fill="#cdb48c"/>
    <path d="M10 4 C12.4 4.2 14.2 5.2 15 6.6 L15 9.6 C13.6 9 12.2 8.6 11 8.4 Z" fill="#a98f68"/>
  </g>
  <!-- dark forehead bar, eye, ear patch, breast patch, bill -->
  <rect x="6" y="6.8" width="4.4" height="1.4" fill="#2a2422"/>
  <rect x="7.6" y="9.2" width="1.6" height="1.6" fill="#12181e"/>
  <path d="M9.4 9.6 L12.4 9.6 L12.4 11.4 L10 11 Z" fill="#4a3f36"/>
  <path d="M11.6 13.4 L14.2 12.6 L14.6 16.4 L12.2 16 Z" fill="#4a3f36"/>
  <path d="M5 10.2 L2.4 10.8 L5 11.6 Z" fill="#12181e"/>
</svg>
