<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Indian Island - Concept 1: The Knapped Point</title>
  <defs>
    <clipPath id="point"><path d="M16 2.4 C18.6 6.6 21.4 12.4 22.4 18.8 L22.6 22.6 L20.6 22.4 L19.6 24.6 L21.2 28.6 L16 27.4 L10.8 28.6 L12.4 24.6 L11.4 22.4 L9.4 22.6 L9.6 18.8 C10.6 12.4 13.4 6.6 16 2.4 Z"/></clipPath>
  </defs>
  <!-- a corner-notched projectile point, flint, upright -->
  <path d="M16 2.4 C18.6 6.6 21.4 12.4 22.4 18.8 L22.6 22.6 L20.6 22.4 L19.6 24.6 L21.2 28.6 L16 27.4 L10.8 28.6 L12.4 24.6 L11.4 22.4 L9.4 22.6 L9.6 18.8 C10.6 12.4 13.4 6.6 16 2.4 Z" fill="#7c828a"/>
  <g clip-path="url(#point)">
    <!-- flake scars: facets struck from each edge toward the midline -->
    <path d="M8 8 L16 11 L16 6 Z" fill="#a8b0b8"/>
    <path d="M8 13 L16 16.4 L16 11.4 Z" fill="#949ca4"/>
    <path d="M8 18.6 L16 21.4 L16 16.8 Z" fill="#a8b0b8"/>
    <path d="M24 9 L16 11.6 L16 6.4 Z" fill="#62686f"/>
    <path d="M24 14.4 L16 17 L16 12 Z" fill="#545a61"/>
    <path d="M24 19.6 L16 22 L16 17.6 Z" fill="#62686f"/>
    <path d="M8 23 L16 26 L16 22 Z" fill="#949ca4"/>
    <path d="M24 23.4 L16 26.4 L16 22.4 Z" fill="#545a61"/>
    <!-- the midline ridge -->
    <rect x="15.6" y="2" width="0.8" height="26" fill="#c9d0d6"/>
  </g>
  <!-- a lit edge on the left -->
  <path d="M16 2.4 C13.4 6.6 10.6 12.4 9.6 18.8 L10.6 18.8 C11.6 12.8 14 7.4 16 4 Z" fill="#d6dde4"/>
</svg>
