<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Cyprian Keyes - Concept 1: The Deacon's Key</title>
  <defs>
    <clipPath id="ballc"><circle cx="8.9" cy="8.9" r="4.5"/></clipPath>
  </defs>
  <g transform="translate(16 16) scale(0.93) translate(-16 -16)">
  <!-- an old hand-forged key in brass, bow at the upper left, bit at the lower right -->
  <g transform="rotate(45 16 16)">
    <circle cx="6" cy="16" r="7" fill="#c99a38"/>
    <rect x="12" y="14.2" width="19.4" height="3.6" fill="#c99a38"/>
    <rect x="12.4" y="12.6" width="2.4" height="6.8" fill="#a57a26"/>
    <rect x="17.4" y="13.4" width="1.6" height="5.2" fill="#a57a26"/>
    <path d="M22.6 17.8 L31.4 17.8 L31.4 23.2 L28.8 23.2 L28.8 20.6 L26.6 20.6 L26.6 23.2 L22.6 23.2 Z" fill="#a57a26"/>
    <rect x="15" y="14.2" width="16.4" height="1.2" fill="#f0d27a"/>
  </g>
  <!-- the bow's lit rim, upper left -->
  <path d="M2 8.9 A6.9 6.9 0 0 1 8.9 2 L8.9 3.8 A5.1 5.1 0 0 0 3.8 8.9 Z" fill="#f0d27a"/>
  <!-- a golf ball set in the bow -->
  <circle cx="8.9" cy="8.9" r="4.5" fill="#f5f4ee"/>
  <circle cx="10.6" cy="10.6" r="4.5" fill="#cfcec5" clip-path="url(#ballc)"/>
  <circle cx="8.6" cy="8.6" r="3.8" fill="#f5f4ee" clip-path="url(#ballc)"/>
  <g fill="#dcdbd3">
    <rect x="8.4" y="6.2" width="1.1" height="1.1"/><rect x="6.2" y="8.6" width="1.1" height="1.1"/><rect x="10" y="8.8" width="1.1" height="1.1"/><rect x="8" y="10.6" width="1.1" height="1.1"/>
  </g>
  <rect x="6.4" y="6" width="1.4" height="1.2" fill="#ffffff"/>
  </g>
</svg>
