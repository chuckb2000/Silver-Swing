<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Fishers Island - Concept 1: The Nun Buoy</title>
  <defs>
    <clipPath id="right"><rect x="16.6" y="0" width="16" height="32"/></clipPath>
    <path id="cone" d="M16 7.8 L23.4 22.4 C23.4 24 8.6 24 8.6 22.4 Z"/>
    <clipPath id="conec"><path d="M16 7.8 L23.4 22.4 C23.4 24 8.6 24 8.6 22.4 Z"/></clipPath>
  </defs>
  <!-- the Sound round the buoy -->
  <ellipse cx="16" cy="26.4" rx="13.4" ry="3.4" fill="#1f5a8f"/>
  <path d="M2.8 26.6 C6 28.8 26 28.8 29.2 26.6 C28.6 28.8 22.6 30 16 30 C9.4 30 3.4 28.8 2.8 26.6 Z" fill="#174a78"/>
  <ellipse cx="16" cy="24.6" rx="8.8" ry="1.6" fill="#e6f1f7"/>
  <!-- the red nun: a cone on a dark float, shaded right, a white reflective band -->
  <use href="#cone" fill="#cc3329"/>
  <use href="#cone" fill="#8f2320" clip-path="url(#right)"/>
  <path d="M16 7.8 L10.2 19.2 L12 19.2 L16 10.6 Z" fill="#e8634d"/>
  <rect x="6" y="16" width="20" height="1.8" fill="#f2efe6" clip-path="url(#conec)"/>
  <rect x="7.8" y="21.6" width="16.4" height="2.4" fill="#3a2421"/>
  <!-- a gull on the top -->
  <ellipse cx="16.6" cy="6.4" rx="3.4" ry="1.6" fill="#f6f6f2"/>
  <path d="M15.6 5.6 L20.6 5 L19.8 6.6 L15.6 6.8 Z" fill="#8a8f96"/>
  <circle cx="13.6" cy="5.2" r="1.3" fill="#f6f6f2"/>
  <rect x="11.4" y="5" width="1.2" height="0.8" fill="#e8a33a"/>
  <rect x="13.2" y="4.6" width="0.6" height="0.6" fill="#1b1c20"/>
</svg>
