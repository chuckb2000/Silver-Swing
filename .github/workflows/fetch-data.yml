# Downloads for course building, the first way to get a course's data (developer,
# 2026-10-29). The sandbox Claude works in can't reach Overpass, USGS or most data
# sites, and can't start a workflow through the GitHub API, but it can push a branch
# and read a release. So a course chat commits data/<id>/fetch.json and pushes its
# branch (any branch but main); this job downloads what the request asks for and
# attaches the files to the course's release (data-<id>), with fetch-log-<id>.json
# saying what happened. pipeline/remote_fetch.py has the request format and the
# sandbox side (new, wait, pull); docs/COURSE_BUILD.md 5.0 the procedure.
name: fetch course data
on:
  push:
    branches-ignore: [main]
    paths: ['data/*/fetch.json', 'fetch/requests/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: osmtogeojson (the converter Overpass Turbo uses)
        run: npm install -g osmtogeojson@3.0.0-beta.5
      - name: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pipeline/remote_fetch.py run --before "${{ github.event.before }}"
